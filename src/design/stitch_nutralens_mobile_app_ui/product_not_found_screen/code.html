<!-- Scanning aperture arc -->

<script>
  function copyBarcode(code) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(() => showToast());
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = code;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {}
      document.body.removeChild(textArea);
    }
  }

  function showToast() {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2200);
  }

  function simulateContribute() {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.querySelector('span:last-child').textContent = "Camera contribution flow launched";
    showToast();
    setTimeout(() => {
      toast.querySelector('span:last-child').textContent = "Barcode copied to clipboard";
    }, 2500);
  }
</script></main>
