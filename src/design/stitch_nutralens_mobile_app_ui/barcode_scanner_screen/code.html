<script>
  (function initScannerView() {
    // Continuous Laser Scan Animation via requestAnimationFrame
    const laser = document.getElementById('scan-laser');
    let scanDirection = 1;
    let scanPos = 16; // px from top
    const minPos = 16;
    const maxPos = 170;

    function step() {
      scanPos += 1.2 * scanDirection;
      if (scanPos >= maxPos) {
        scanDirection = -1;
      } else if (scanPos <= minPos) {
        scanDirection = 1;
      }
      if (laser) {
        laser.style.top = scanPos + 'px';
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    // Flash / Torch Toggle Micro-interaction
    const torchBtn = document.getElementById('torch-btn');
    const torchIcon = document.getElementById('torch-icon');
    let torchState = false;

    if (torchBtn && torchIcon) {
      torchBtn.addEventListener('click', () => {
        torchState = !torchState;
        if (torchState) {
          torchIcon.innerText = 'flash_on';
          torchIcon.classList.add('text-primary-fixed');
          torchBtn.classList.add('bg-surface-container-lowest/30');
        } else {
          torchIcon.innerText = 'flash_off';
          torchIcon.classList.remove('text-primary-fixed');
          torchBtn.classList.remove('bg-surface-container-lowest/30');
        }
      });
    }

    // Manual Entry Tray Toggle
    const manualBtn = document.getElementById('manual-entry-btn');
    const manualCard = document.getElementById('manual-input-card');
    const closeManualBtn = document.getElementById('close-manual-btn');
    const inputField = document.getElementById('barcode-input-field');

    if (manualBtn && manualCard && closeManualBtn) {
      manualBtn.addEventListener('click', () => {
        manualCard.classList.remove('hidden');
        manualBtn.classList.add('hidden');
        if (inputField) inputField.focus();
      });

      closeManualBtn.addEventListener('click', () => {
        manualCard.classList.add('hidden');
        manualBtn.classList.remove('hidden');
      });
    }
  })();
</script></main>
